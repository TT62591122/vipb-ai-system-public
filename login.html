<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - VIPB AI System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }
    .login-header p {
      color: #666;
      font-size: 14px;
    }
    .form-control {
      height: 48px;
      border-radius: 8px;
      border: 1px solid #ddd;
      padding: 0 16px;
      font-size: 15px;
    }
    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .btn-login {
      height: 48px;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }
    .alert {
      border-radius: 8px;
      font-size: 14px;
    }
    .default-account {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 12px;
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
    .default-account strong {
      color: #333;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1>🚀 VIPB AI System</h1>
      <p>外贸全自动化系统 V2.0</p>
    </div>
    
    
    
    <form method="POST" action="/login">
      <input type="hidden" name="_csrf" value="GbxgCcMf-B3NoE_-cwVRapUKfO4Vj-wmgn5s">
      <div class="mb-3">
        <label class="form-label">用户名</label>
        <input type="text" class="form-control" name="username" placeholder="请输入用户名" required autofocus>
      </div>
      
      <div class="mb-4">
        <label class="form-label">密码</label>
        <input type="password" class="form-control" name="password" placeholder="请输入密码" required>
      </div>
      
      <button type="submit" class="btn btn-primary btn-login w-100">登录</button>
    </form>
    
    <!-- 默认账号提示已移除（安全加固） -->
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
